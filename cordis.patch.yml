# dsh bundle patch: inserts the grafana plugin into a profile's layer stack.
# One row is enough. The client module system hangs a package's browser half on
# the row whose specifier resolves to the package ROOT, so this bare-name row
# carries both the host half (index.js) and the settings card (lib/client.js).
# A second row spelling a subpath (dsh-grafana-plugin/client-host) would resolve
# to no package root and fail to import.
- insert:
    - id: grafana-plugin
      name: dsh-grafana-plugin
